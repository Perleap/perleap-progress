name: Supabase deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: supabase-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' ||
       github.event.workflow_run.head_branch == 'staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.92.1

      - name: Link, migrate, config push, and deploy functions (production)
        if: github.event.workflow_run.head_branch == 'main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          supabase link --project-ref zwhnpteterkrunfevixs --password "$SUPABASE_DB_PASSWORD"
          supabase db push
          supabase config push --project-ref zwhnpteterkrunfevixs
          bash scripts/deploy-all-edge-functions.sh

      - name: Link, migrate, config push, and deploy functions (staging)
        if: github.event.workflow_run.head_branch == 'staging'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          supabase link --project-ref otjfoeyqiuerrgrdtgqx --password "$SUPABASE_DB_PASSWORD"
          supabase db push
          supabase config push --project-ref otjfoeyqiuerrgrdtgqx
          bash scripts/deploy-all-edge-functions.sh
