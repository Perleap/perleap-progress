# Global storage upload cap (must be >= bucket limits). Push with: supabase config push --project-ref <ref>
[storage]
file_size_limit = "1GiB"

[storage.buckets.syllabus-resources]
public = true
file_size_limit = "1GiB"

# Auth settings for config push — staging project (otjfoeyqiuerrgrdtgqx)
[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://staging.perleap.ai/**", "https://staging.perleap.ai", "https://perleap.ai/**", "https://perleap.ai"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"

[functions.perleap-chat]
verify_jwt = true

# Tier-A evaluation pipeline (SEC-003 handler auth + SEC-005 gateway JWT)
[functions.generate-feedback]
verify_jwt = true

[functions.extract-unit-memory]
verify_jwt = true

[functions.backfill-unit-memory]
verify_jwt = true

[functions.regenerate-scores]
verify_jwt = true

[functions.refresh-class-evaluations]
verify_jwt = true
# Async job: compute all students, commit at end. REFRESH_EVAL_CONCURRENCY (default 4, max 5).
# ~150s edge limit may still apply to very large classes.

[functions.cancel-evaluation-refresh]
verify_jwt = true

[functions.undo-evaluation-refresh]
verify_jwt = true

[functions.compute-nuance-insights]
verify_jwt = true

[functions.transcribe-live-session]
verify_jwt = true

[functions.evaluate-from-feedback]
verify_jwt = true

# Tier-B tools with in-handler auth (SEC-005)
[functions.suggest-assignment-hard-skills]
verify_jwt = true

[functions.generate-student-facing-task]
verify_jwt = true

[functions.explain-analytics-5d]
verify_jwt = true

[functions.pilot-readiness]
verify_jwt = true

[functions.admin-monitoring-probe]
verify_jwt = true

[functions.admin-vercel-insights]
verify_jwt = true

# OpenAI proxies — handler auth added in SEC-004; gateway JWT in SEC-005b
[functions.rephrase-text]
verify_jwt = true

[functions.teacher-assistant-chat]
verify_jwt = true

[functions.speech-to-text]
